name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
  id-token: write
concurrency:
  group: release
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless)
        run: cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"
      - name: Bump the tag in the gitops branch
        run: |
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          cp scripts/bump-tag.sh "$RUNNER_TEMP/"
          git fetch origin gitops
          git switch gitops
          bash "$RUNNER_TEMP/bump-tag.sh" "$IMAGE:${GITHUB_SHA}"
          git commit -am "deploy ${GITHUB_SHA::7}"
          git push origin gitops
