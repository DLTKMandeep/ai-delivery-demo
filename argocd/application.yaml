apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reports
  namespace: argocd
spec:
  project: default
  source:
    repoURL: REPO_URL
    targetRevision: gitops
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: reports
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
